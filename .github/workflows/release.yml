name: Release
# Publishes the container images (the application and the optional OCR service) to GHCR and creates the GitHub release when a version tag (vX.Y.Z or vX.Y.Z-rc.N) is pushed.
# It can also be started by hand to check that the image builds for both architectures (nothing is published).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write     # create the release
  packages: write     # push the image to ghcr.io
  attestations: write
  id-token: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches the package version
        id: ver
        run: |
          pkg=$(sed -n 's/^version = "\(.*\)"/\1/p' api/pyproject.toml | head -1)
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            base="${tag%%-*}"
            if [ "$base" != "$pkg" ]; then echo "::error::tag $GITHUB_REF_NAME does not match api/pyproject.toml version $pkg"; exit 1; fi
          fi
      - name: Image name in lowercase
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=sha,enable=${{ github.ref_type != 'tag' }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - uses: actions/attest-build-provenance@v4
        if: github.ref_type == 'tag'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  ocr-image:  # the optional OCR service (#135), apart so that the main image does not grow; same version and tags
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Image name in lowercase
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-ocr" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=sha,enable=${{ github.ref_type != 'tag' }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ocr
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.image.outputs.version }}
          cache-from: type=gha,scope=ocr
          cache-to: type=gha,mode=max,scope=ocr
          provenance: true
          sbom: true
      - uses: actions/attest-build-provenance@v4
        if: github.ref_type == 'tag'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    needs: [image, ocr-image]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assets and their checksums
        run: |
          cp .env.example env.example
          sha256sum docker-compose.yml env.example update.sh install.sh install.ps1 > SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See the [changelog](CHANGELOG.md)." > notes.md; fi
          repo="https://github.com/${GITHUB_REPOSITORY}"
          if grep -q '^STAGE = "beta"' api/mimirsynth/brand.py; then   # the release stage the interface also shows (#366)
            {
              echo "> **Public beta.** Until 1.0 the API, the MCP tools and the database schema may change between minor versions; the migrations run on start and \`update.sh\` makes a backup first."
              echo "> Problems and feedback: [open an issue](${repo}/issues/new/choose) (never paste tokens or passwords). Questions: [Discussions](${repo}/discussions/categories/q-a)."
              echo
              cat notes.md
            } > notes.tmp && mv notes.tmp notes.md
          fi
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          {
            echo
            echo "**Image:** \`ghcr.io/${GITHUB_REPOSITORY,,}:${v}\` (linux/amd64, linux/arm64)"
            echo "**Optional OCR service:** \`ghcr.io/${GITHUB_REPOSITORY,,}-ocr:${v}\` (the \`ocr\` profile of the compose file)"
            echo
            echo "**Install** with one command (see the installation guide):"
            echo "- Linux and macOS: \`curl -fsSL ${base}/install.sh | bash\`"
            echo "- Windows, with Docker Desktop: \`irm ${base}/install.ps1 | iex\` in PowerShell"
            echo
            echo "Or by hand, with \`docker-compose.yml\` and \`env.example\` from this release's assets. **Update:** \`update.sh\` (backup, update and checks in one step)."
            echo
            echo "**SHA-256 of the assets** (also in \`SHA256SUMS\`: \`sha256sum -c SHA256SUMS --ignore-missing\`):"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md $flags \
            docker-compose.yml env.example update.sh install.sh install.ps1 SHA256SUMS
