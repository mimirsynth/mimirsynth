name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:v4.22.0
        ports: ["6379:6379"]
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: mimirsynth
          POSTGRES_PASSWORD: mimirsynth
          POSTGRES_DB: mimirsynth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mimirsynth"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7   # the TypeScript agent client runs its contract tests against the test instance (#369)
        with: {node-version: 22}
      - run: cd api && uv venv && uv pip install -e ".[pdf]" pytest pyyaml   # pyyaml: the wiki index check (test_repo_tooling); pdf: the OCR tests read PDFs (#135)
      - name: Tests (con FalkorDB real)
        env:
          MIMIRSYNTH_TEST_FALKOR: localhost
        run: cd api && .venv/bin/pytest -q --ignore=tests/test_docs_pg.py
      - name: Tests de memoria documental (PostgreSQL + pgvector real)
        env:
          MIMIRSYNTH_TEST_PG: postgresql+psycopg://mimirsynth:mimirsynth@localhost:5432/mimirsynth_test
        run: cd api && .venv/bin/pytest -q tests/test_docs_pg.py
      - name: Limitador de peticiones (PostgreSQL real, concurrencia)
        env:
          MIMIRSYNTH_TEST_PG: postgresql+psycopg://mimirsynth:mimirsynth@localhost:5432/mimirsynth_test
        run: cd api && .venv/bin/pytest -q tests/test_ratelimit_pg.py
      - name: Cambio de modelo de embeddings (PostgreSQL + pgvector y FalkorDB reales)
        env:
          MIMIRSYNTH_TEST_PG: postgresql+psycopg://mimirsynth:mimirsynth@localhost:5432/mimirsynth_test
          MIMIRSYNTH_TEST_FALKOR: localhost
        run: cd api && .venv/bin/pytest -q tests/test_reembed_pg.py
      - name: Importar un brain (PostgreSQL + pgvector y FalkorDB reales)
        env:
          MIMIRSYNTH_TEST_PG: postgresql+psycopg://mimirsynth:mimirsynth@localhost:5432/mimirsynth_test
          MIMIRSYNTH_TEST_FALKOR: localhost
        run: cd api && .venv/bin/pytest -q tests/test_brain_import_pg.py
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: cd web && npm ci && npm run build && npm test   # npm test: the tooling in web/scripts (translation fragments)
  agent-client:
    # The shared client library's TypeScript port (#369): types, and the contract cases every implementation passes. The Python one
    # and both ports against a test instance run in the api job (tests/test_agent_client.py, tests/test_agent_contract.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm, cache-dependency-path: integrations/shared/typescript/package-lock.json}
      - run: cd integrations/shared/typescript && npm ci && npm run check && npm test
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t mimirsynth:ci .
      - name: The OCR service builds and reads a scanned image (#135)
        run: |
          docker build -t mimirsynth-ocr:ci ocr/
          docker run -d --name ocr -p 127.0.0.1:8001:8001 --read-only --tmpfs /tmp --cap-drop ALL mimirsynth-ocr:ci
          for i in $(seq 1 30); do curl -sf localhost:8001/health && break; sleep 1; done
          curl -sf localhost:8001/health | grep -q '"spa"'
          out=$(curl -sf -X POST --data-binary @ocr/testdata/sample.png "localhost:8001/ocr?lang=spa%2Beng")
          echo "$out"
          echo "$out" | grep -q 4471
      - name: The installer installs from scratch with the bundled FalkorDB, and a second run detects it (#360)
        run: |
          docker tag mimirsynth:ci ghcr.io/mimirsynth/mimirsynth:ci   # the compose file's image at version "ci": nothing is pulled
          ./install.sh --yes --from . --version ci --dir "$RUNNER_TEMP/local" --no-browser | tee "$RUNNER_TEMP/local.log"
          grep -q "First-start code: [A-Za-z0-9_-]\{16\}" "$RUNNER_TEMP/local.log"
          cd "$RUNNER_TEMP/local"
          [ "$(stat -c %a .env)" = 600 ]
          grep -q '^COMPOSE_PROFILES=bundled$' .env
          [ "$(grep -c '^POSTGRES_PASSWORD=[0-9a-f]\{64\}$' .env)" = 1 ]
          curl -sf localhost:8000/api/health | grep -q '"graph":true'
          "$GITHUB_WORKSPACE/install.sh" --yes --from "$GITHUB_WORKSPACE" --no-browser | grep -q "already installed"
      - name: The installer connects to an existing FalkorDB on the host (#360)
        run: |
          docker run -d --name existing-falkor --network host falkordb/falkordb:v4.22.0   # listens on the host itself, port 6379
          for i in $(seq 1 30); do (exec 3<>/dev/tcp/127.0.0.1/6379) 2>/dev/null && break; sleep 1; done
          ./install.sh --yes --from . --version ci --dir "$RUNNER_TEMP/existing" --no-browser \
            --graph existing --graph-type falkordb --graph-host localhost --graph-port 6379 | tee "$RUNNER_TEMP/existing.log"
          grep -q "The container reaches host.docker.internal:6379" "$RUNNER_TEMP/existing.log"
          cd "$RUNNER_TEMP/existing"
          grep -q '^MIMIRSYNTH_FALKOR_HOST=host.docker.internal$' .env
          grep -q '^COMPOSE_PROFILES=$' .env
          [ -z "$(docker compose ps -q falkordb)" ]
          curl -sf "localhost:$(grep '^MIMIRSYNTH_PORT=' .env | cut -d= -f2)/api/health" | grep -q '"graph":true'   # the next free port: 8001 is the OCR step's
      - name: The installer stops when an existing graph database does not answer (#360)
        run: |
          if ./install.sh --yes --from . --version ci --dir "$RUNNER_TEMP/nothing" --no-start --graph existing --graph-host 127.0.0.1 --graph-port 6391; then exit 1; fi
          [ ! -f "$RUNNER_TEMP/nothing/.env" ]
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck (install.sh, update.sh)
        run: shellcheck install.sh && shellcheck -S warning update.sh
      - name: install.ps1 parses, is plain ASCII (Windows PowerShell 5.1 reads it in the ANSI code page) and passes PSScriptAnalyzer
        shell: pwsh
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { $_.ToString() }; exit 1 }
          if ([IO.File]::ReadAllBytes("$PWD/install.ps1") | Where-Object { $_ -gt 127 }) { throw "install.ps1 must be plain ASCII: write Spanish letters as \uXXXX" }
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error
          if ($r) { $r | Format-Table -AutoSize | Out-String | Write-Host; exit 1 }
