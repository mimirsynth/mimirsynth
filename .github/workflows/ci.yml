name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
jobs:
  changes:
    # Which jobs a pull request needs, from the files it changes (the merge commit against its base). A push to main, or a change to
    # this file, runs them all. The jobs below fail open: if this job fails, its outputs are empty and every job runs. A job skipped by
    # its condition reports success, so the required checks (api, web, docker) never wait for a job that has nothing to test.
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.f.outputs.api }}
      api-neo4j: ${{ steps.f.outputs.api-neo4j }}
      web: ${{ steps.f.outputs.web }}
      agent-client: ${{ steps.f.outputs.agent-client }}
      npm-packages: ${{ steps.f.outputs.npm-packages }}
      image: ${{ steps.f.outputs.image }}
      installer-desktop: ${{ steps.f.outputs.installer-desktop }}
      scripts: ${{ steps.f.outputs.scripts }}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 2}   # the merge commit and its first parent, the base branch
      - id: f
        run: |
          all=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then all=true; files=""
          else files="$(git diff --name-only HEAD^1 HEAD)"; grep -qx '.github/workflows/ci.yml' <<<"$files" && all=true
          fi
          printf '%s\n' "$files"
          # out NAME REGEX [EXCLUDE]: NAME runs when a changed file matches REGEX and not EXCLUDE
          out() { if [ $all = true ] || grep -vE "${3:-^$}" <<<"$files" | grep -qE "$2"; then echo "$1=true"; else echo "$1=false"; fi >> "$GITHUB_OUTPUT"; }
          # api, api-neo4j: the API and what its tests read (plugins, scripts, docs and wiki, marketplaces, the server's translations).
          # Not the npm plugins: their tests in api/tests need `npm ci` in the plugin, which only their own workflows run (here they skip).
          npm_plugins='^integrations/(opencode|openclaw)/'
          out api '^(api/|integrations/|scripts/|docs/|ocr/|\.claude-plugin/|\.agents/|web/src/i18n/)' "$npm_plugins"
          out api-neo4j '^(api/|integrations/|scripts/|ocr/|\.claude-plugin/|\.agents/|web/src/i18n/)' "$npm_plugins"   # docs/: the api job checks them
          out web '^web/'
          out agent-client '^integrations/shared/'
          out npm-packages '^(integrations/(opencode|openclaw|shared)/|scripts/npm_package\.mjs$)'
          # docker, installer-clean: the images and the installer that starts them
          out image '^(Dockerfile|\.dockerignore|docker-compose[^/]*\.yml|install\.sh|api/|web/|ocr/)'
          out installer-desktop '^(install\.(sh|ps1)|docker-compose\.yml|\.github/installer-config-test\.ps1)$'
          out scripts '^(install\.(sh|ps1)|update\.sh|\.github/update-version-test\.sh)$'
          cat "$GITHUB_OUTPUT"
  api:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.api != 'false' }}
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:v4.22.0
        ports: ["6379:6379"]
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: mimirsynth
          POSTGRES_PASSWORD: mimirsynth
          POSTGRES_DB: mimirsynth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mimirsynth"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7   # the TypeScript agent client runs its contract tests against the test instance (#369)
        with: {node-version: 22}
      - run: cd api && uv venv && uv pip install -e ".[pdf]" pytest pyyaml   # pyyaml: the wiki index check (test_repo_tooling); pdf: the OCR tests read PDFs (#135)
      - name: Tests (con FalkorDB real)
        env:
          MIMIRSYNTH_TEST_FALKOR: localhost
        run: cd api && .venv/bin/pytest -q --ignore=tests/test_docs_pg.py
      - name: Tests de memoria documental (PostgreSQL + pgvector real)
        env:
          MIMIRSYNTH_TEST_PG: postgresql+psycopg://mimirsynth:mimirsynth@localhost:5432/mimirsynth_test
        run: cd api && .venv/bin/pytest -q tests/test_docs_pg.py
      - name: Limitador de peticiones (PostgreSQL real, concurrencia)
        env:
          MIMIRSYNTH_TEST_PG: postgresql+psycopg://mimirsynth:mimirsynth@localhost:5432/mimirsynth_test
        run: cd api && .venv/bin/pytest -q tests/test_ratelimit_pg.py
      - name: Cambio de modelo de embeddings (PostgreSQL + pgvector y FalkorDB reales)
        env:
          MIMIRSYNTH_TEST_PG: postgresql+psycopg://mimirsynth:mimirsynth@localhost:5432/mimirsynth_test
          MIMIRSYNTH_TEST_FALKOR: localhost
        run: cd api && .venv/bin/pytest -q tests/test_reembed_pg.py
      - name: Importar un brain (PostgreSQL + pgvector y FalkorDB reales)
        env:
          MIMIRSYNTH_TEST_PG: postgresql+psycopg://mimirsynth:mimirsynth@localhost:5432/mimirsynth_test
          MIMIRSYNTH_TEST_FALKOR: localhost
        run: cd api && .venv/bin/pytest -q tests/test_brain_import_pg.py
  api-neo4j:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.api-neo4j != 'false' }}
    # The same API suite against Neo4j (#357): the oldest version supported (5.26 LTS), Community. MIMIRSYNTH_TEST_NEO4J turns the
    # graph tests on with the Neo4j backend (tests/conftest.py); the tests of FalkorDB's own dump skip there. The suite runs with
    # neo4j://, the routing driver that Neo4j Aura needs and that the installer and Administration use (#408), and the graph tests
    # again with bolt://, which a URI can still ask for.
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/mimirsynth-ci
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p mimirsynth-ci 'RETURN 1'"
          --health-interval 5s --health-timeout 10s --health-retries 30
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: mimirsynth
          POSTGRES_PASSWORD: mimirsynth
          POSTGRES_DB: mimirsynth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mimirsynth"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIMIRSYNTH_TEST_NEO4J: neo4j://localhost:7687
      MIMIRSYNTH_NEO4J_USER: neo4j
      MIMIRSYNTH_NEO4J_PASSWORD: mimirsynth-ci
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - run: cd api && uv venv && uv pip install -e ".[pdf]" pytest pyyaml
      - name: Tests (con Neo4j real)
        run: cd api && .venv/bin/pytest -q --ignore=tests/test_docs_pg.py
      - name: Tests del grafo con bolt:// (conexión directa)
        env:
          MIMIRSYNTH_TEST_NEO4J: bolt://localhost:7687
        run: cd api && .venv/bin/pytest -q tests/test_graphdb.py tests/test_graph_connection.py tests/test_neo4j_isolation.py
      - name: Cambio de modelo de embeddings (PostgreSQL + pgvector y Neo4j reales)
        env:
          MIMIRSYNTH_TEST_PG: postgresql+psycopg://mimirsynth:mimirsynth@localhost:5432/mimirsynth_test
        run: cd api && .venv/bin/pytest -q tests/test_reembed_pg.py
      - name: Importar un brain (PostgreSQL + pgvector y Neo4j reales)
        env:
          MIMIRSYNTH_TEST_PG: postgresql+psycopg://mimirsynth:mimirsynth@localhost:5432/mimirsynth_test
        run: cd api && .venv/bin/pytest -q tests/test_brain_import_pg.py
  web:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: cd web && npm ci && npm run build && npm test   # npm test: the tooling in web/scripts (translation fragments)
  agent-client:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.agent-client != 'false' }}
    # The shared client library's TypeScript port (#369): types, and the contract cases every implementation passes. The Python one
    # and both ports against a test instance run in the api job (tests/test_agent_client.py, tests/test_agent_contract.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm, cache-dependency-path: integrations/shared/typescript/package-lock.json}
      - run: cd integrations/shared/typescript && npm ci && npm run check && npm test
  npm-packages:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.npm-packages != 'false' }}
    # The plugins the release publishes to npm (OpenCode, OpenClaw) pack into a complete package on every pull request, not only on those
    # that touch them (their own workflows check the rest): what npm would publish (npm pack --dry-run), with every file package.json
    # points at and the metadata npm publish --provenance needs (scripts/npm_package.mjs). Nothing is published.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [opencode, openclaw]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm, cache-dependency-path: "integrations/${{ matrix.package }}/package-lock.json"}
      - run: cd "integrations/${{ matrix.package }}" && npm ci
      - run: node scripts/npm_package.mjs "integrations/${{ matrix.package }}"
  docker:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.image != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t mimirsynth:ci .
      - name: The OCR service builds and reads a scanned image (#135)
        run: |
          docker build -t mimirsynth-ocr:ci ocr/
          docker run -d --name ocr -p 127.0.0.1:8001:8001 --read-only --tmpfs /tmp --cap-drop ALL mimirsynth-ocr:ci
          for i in $(seq 1 30); do curl -sf localhost:8001/health && break; sleep 1; done
          curl -sf localhost:8001/health | grep -q '"spa"'
          out=$(curl -sf -X POST --data-binary @ocr/testdata/sample.png "localhost:8001/ocr?lang=spa%2Beng")
          echo "$out"
          echo "$out" | grep -q 4471
      - name: The installer installs from scratch with the bundled FalkorDB, and a second run detects it (#360)
        run: |
          docker tag mimirsynth:ci ghcr.io/mimirsynth/mimirsynth:ci   # the compose file's image at version "ci": nothing is pulled
          ./install.sh --yes --from . --version ci --dir "$RUNNER_TEMP/local" --no-browser | tee "$RUNNER_TEMP/local.log"
          grep -q "First-start code: [A-Za-z0-9_-]\{16\}" "$RUNNER_TEMP/local.log"
          cd "$RUNNER_TEMP/local"
          [ "$(stat -c %a .env)" = 600 ]
          grep -q '^COMPOSE_PROFILES=bundled$' .env
          [ "$(grep -c '^POSTGRES_PASSWORD=[0-9a-f]\{64\}$' .env)" = 1 ]
          curl -sf localhost:8000/api/health | grep -q '"graph":true'
          "$GITHUB_WORKSPACE/install.sh" --yes --from "$GITHUB_WORKSPACE" --no-browser | grep -q "already installed"
      - name: The installer connects to an existing FalkorDB on the host (#360)
        run: |
          docker run -d --name existing-falkor --network host falkordb/falkordb:v4.22.0   # listens on the host itself, port 6379
          for i in $(seq 1 30); do (exec 3<>/dev/tcp/127.0.0.1/6379) 2>/dev/null && break; sleep 1; done
          ./install.sh --yes --from . --version ci --dir "$RUNNER_TEMP/existing" --no-browser \
            --graph existing --graph-type falkordb --graph-host localhost --graph-port 6379 | tee "$RUNNER_TEMP/existing.log"
          grep -q "Connection test passed: FalkorDB" "$RUNNER_TEMP/existing.log"   # before the start, from a container (host.docker.internal)
          cd "$RUNNER_TEMP/existing"
          grep -q '^MIMIRSYNTH_FALKOR_HOST=host.docker.internal$' .env
          grep -q '^COMPOSE_PROFILES=$' .env
          [ -z "$(docker compose ps -q falkordb)" ]
          curl -sf "localhost:$(grep '^MIMIRSYNTH_PORT=' .env | cut -d= -f2)/api/health" | grep -q '"graph":true'   # the next free port: 8001 is the OCR step's
      - name: Before the start the installer runs the API's full connection test; a wrong password stops it with nothing left behind (#360)
        run: |
          set -o pipefail
          docker run -d --name locked-falkor -p 6380:6379 -e REDIS_ARGS="--requirepass ci-s3cret" falkordb/falkordb:v4.22.0
          for i in $(seq 1 30); do (exec 3<>/dev/tcp/127.0.0.1/6380) 2>/dev/null && break; sleep 1; done
          flags="--yes --from . --version ci --no-browser --dir $RUNNER_TEMP/locked --graph existing --graph-type falkordb --graph-host localhost --graph-port 6380"
          if MIMIRSYNTH_GRAPH_PASSWORD=wrong ./install.sh $flags 2>&1 | tee "$RUNNER_TEMP/locked-wrong.log"; then exit 1; fi
          grep -q "the connection test failed: The server rejects the user or the password" "$RUNNER_TEMP/locked-wrong.log"
          [ ! -e "$RUNNER_TEMP/locked/.env" ] && [ ! -e "$RUNNER_TEMP/locked/docker-compose.yml" ]
          [ -z "$(docker volume ls -q --filter name=locked_)" ]   # the test container leaves no volume behind
          MIMIRSYNTH_GRAPH_PASSWORD=ci-s3cret ./install.sh $flags | tee "$RUNNER_TEMP/locked.log"
          grep -q "Connection test passed: FalkorDB 4.22" "$RUNNER_TEMP/locked.log"
          cd "$RUNNER_TEMP/locked"
          grep -q '^MIMIRSYNTH_FALKOR_PASSWORD=ci-s3cret$' .env
          curl -sf "localhost:$(grep '^MIMIRSYNTH_PORT=' .env | cut -d= -f2)/api/health" | grep -q '"graph":true'
      - name: The installer runs the same test against an existing Neo4j and starts on it (#360)
        run: |
          set -o pipefail
          docker run -d --name existing-neo4j -p 7687:7687 -e NEO4J_AUTH=neo4j/mimirsynth-ci neo4j:5.26-community
          for i in $(seq 1 60); do docker exec existing-neo4j cypher-shell -u neo4j -p mimirsynth-ci 'RETURN 1' >/dev/null 2>&1 && break; sleep 2; done
          MIMIRSYNTH_GRAPH_PASSWORD=mimirsynth-ci ./install.sh --yes --from . --version ci --no-browser --dir "$RUNNER_TEMP/neo4j" \
            --graph existing --graph-type neo4j --graph-host localhost --graph-port 7687 | tee "$RUNNER_TEMP/neo4j.log"
          grep -q "Connection test passed: Neo4j 5.26.*, database «neo4j» (the user's default)" "$RUNNER_TEMP/neo4j.log"
          cd "$RUNNER_TEMP/neo4j"
          grep -q '^MIMIRSYNTH_NEO4J_URI=neo4j://host.docker.internal:7687$' .env   # the routing scheme, as Aura needs (#408)
          curl -sf "localhost:$(grep '^MIMIRSYNTH_PORT=' .env | cut -d= -f2)/api/health" | grep -q '"graph":true,.*"backend":"neo4j"'
      - name: When the started instance cannot use an existing graph database, the installer fails instead of finishing (#408)
        run: |
          set -o pipefail
          export MIMIRSYNTH_GRAPH_PASSWORD=mimirsynth-ci
          ./install.sh --yes --from . --version ci --no-start --dir "$RUNNER_TEMP/neo4j-nodb" --graph existing --graph-type neo4j \
            --graph-host localhost --graph-port 7687 --graph-database zz-missing --skip-graph-check 2>&1 | tee "$RUNNER_TEMP/nodb-config.log"   # WARN goes to stderr
          grep -q "The server has no database «zz-missing». Leave the database empty" "$RUNNER_TEMP/nodb-config.log"
          if ./install.sh --yes --from . --version ci --no-browser --dir "$RUNNER_TEMP/neo4j-nodb" 2>&1 | tee "$RUNNER_TEMP/nodb.log"; then exit 1; fi
          grep -q "cannot use the graph database until the connection works" "$RUNNER_TEMP/nodb.log"
          cd "$RUNNER_TEMP/neo4j-nodb" && docker compose down -v
      - name: The installer stops when an existing graph database does not answer (#360)
        run: |
          if ./install.sh --yes --from . --version ci --dir "$RUNNER_TEMP/nothing" --no-start --graph existing --graph-host 127.0.0.1 --graph-port 6391; then exit 1; fi
          [ ! -f "$RUNNER_TEMP/nothing/.env" ]
  installer-clean:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.image != 'false' }}
    # #360 on a clean Ubuntu and a clean Debian, with no Docker: the installer arrives through a pipe as with `curl | bash`, installs
    # Docker with get.docker.com, starts the stack and opens the browser on the first-start screen, where the setup wizard begins.
    # The distribution runs in a container on the host's network; the Docker CLI installed inside drives the runner's daemon through
    # its socket, and the install folder has the same path on both sides, so the compose file's bind mount means the same folder.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: "ubuntu:24.04", lang: en_US.UTF-8, code: "First-start code"}
          - {image: "debian:12", lang: es_ES.UTF-8, code: "Código de inicio"}
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t ghcr.io/mimirsynth/mimirsynth:ci .   # the compose file's image at version "ci": nothing is pulled
      - name: Install on a clean ${{ matrix.image }}
        env: {IMAGE: "${{ matrix.image }}", LOCALE: "${{ matrix.lang }}"}
        run: |
          set -o pipefail
          dir="$RUNNER_TEMP/clean"; mkdir -p "$dir"
          docker run --rm --network host -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src:ro" -v "$dir:$dir" \
            -e LANG="$LOCALE" -e DIR="$dir" "$IMAGE" bash -ec '
              apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates >/dev/null
              if command -v docker; then echo "this image already has Docker"; exit 1; fi
              mkdir -p /tmp/bin && printf "#!/bin/sh\necho \"\$1\" > /tmp/opened\n" > /tmp/bin/xdg-open && chmod +x /tmp/bin/xdg-open
              cat /src/install.sh | PATH="/tmp/bin:$PATH" DISPLAY=:0 bash -s -- --yes --install-docker --from /src --version ci --dir "$DIR"
              sleep 2; cp /tmp/opened "$DIR/opened"
            ' 2>&1 | tee "$RUNNER_TEMP/clean.log"
          grep -q "${{ matrix.code }}: [A-Za-z0-9_-]\{16\}" "$RUNNER_TEMP/clean.log"
          cd "$dir"
          # .env belongs to the container's root, readable only by it (mode 600): sudo
          url="$(cat opened)"; port="$(sudo grep '^MIMIRSYNTH_PORT=' .env | cut -d= -f2)"; base="http://localhost:$port"
          # The browser opened on the setup wizard (/configuracion) when the instance has it (#361; its API answers 401), else on the root
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/setup")" = 401 ]; then [ "$url" = "$base/configuracion" ]; else [ "$url" = "$base" ]; fi
          curl -sf "$base/api/health" | grep -q '"graph":true'
          curl -sf "$base/api/auth/options" | grep -q '"setup":true'   # the first-start screen: the administrator, then the wizard
          curl -sf "$url" | grep -q '<div id="root">'
          [ "$(sudo stat -c %a .env)" = 600 ] && sudo grep -q '^COMPOSE_PROFILES=bundled$' .env
  installer-desktop:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.installer-desktop != 'false' }}
    # #360 where the hosted runners have no Docker Desktop: the scripts under the shells people run them with (macOS's own bash 3.2
    # with BSD tools, PowerShell 7 on macOS, Windows PowerShell 5.1 in the documented `& ([scriptblock]::Create(...))` form) against a
    # stand-in `docker` that says yes, up to the configuration they write. Starting the stack on Docker Desktop is a manual test.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: A stand-in docker (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/shim"
          cat > "$RUNNER_TEMP/shim/docker" <<'EOF'
          #!/bin/sh
          # Docker Desktop's stand-in: everything works; `docker run` (the connection test) answers «not available in this release».
          case "$*" in
            --version) echo "Docker version 0.0.0 (stand-in)" ;;
            "compose version --short") echo "2.99.0" ;;
            run*) cat >/dev/null; exit 3 ;;
            "compose ps -aq mimirsynth") [ -z "${FAKE_CONTAINER:-}" ] || echo "$FAKE_CONTAINER" ;;   # an existing installation (#403)
          esac
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/shim/docker"
          echo "$RUNNER_TEMP/shim" >> "$GITHUB_PATH"
      - name: install.sh under macOS's bash 3.2
        if: runner.os == 'macOS'
        shell: /bin/bash -e {0}
        run: |
          /bin/bash --version | head -n 1
          /bin/bash install.sh --yes --from . --version ci --no-start --dir "$RUNNER_TEMP/sh-local"
          cd "$RUNNER_TEMP/sh-local"
          [ "$(stat -f %Lp .env)" = 600 ]
          grep -q '^COMPOSE_PROFILES=bundled$' .env
          [ "$(grep -c '^MIMIRSYNTH_SESSION_SECRET=[0-9a-f]\{64\}$' .env)" = 1 ]
          [ ! -e update.sh ]   # update.sh is for Linux
          cd "$GITHUB_WORKSPACE"
          /bin/bash install.sh --yes --from . --version ci --no-start --dir "$RUNNER_TEMP/sh-neo4j" --lang es \
            --graph existing --graph-type neo4j --graph-host localhost --graph-port 1 --graph-tls --skip-graph-check
          grep -q '^MIMIRSYNTH_NEO4J_URI=neo4j+s://host.docker.internal:1$' "$RUNNER_TEMP/sh-neo4j/.env"
          grep -q '^MIMIRSYNTH_DEFAULT_LANGUAGE=es$' "$RUNNER_TEMP/sh-neo4j/.env"
          grep -q '^COMPOSE_PROFILES=$' "$RUNNER_TEMP/sh-neo4j/.env"
          /bin/bash install.sh --yes --from . --version ci --no-start --dir "$RUNNER_TEMP/sh-bolt" --graph existing --graph-type neo4j \
            --graph-host db.example.com --graph-port 7687 --graph-scheme bolt --skip-graph-check
          grep -q '^MIMIRSYNTH_NEO4J_URI=bolt://db.example.com:7687$' "$RUNNER_TEMP/sh-bolt/.env"
      - name: A stand-in docker (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $shim = Join-Path $env:RUNNER_TEMP "shim"; New-Item -ItemType Directory -Force $shim | Out-Null
          Set-Content -Encoding ASCII (Join-Path $shim "docker.cmd") @(
            '@echo off',
            'if "%~1"=="--version" echo Docker version 0.0.0 (stand-in)',
            'if "%~1 %~2 %~3"=="compose version --short" echo 2.99.0',
            'if "%~1"=="run" (findstr "^" >nul & exit /b 3)',
            'if "%~1 %~2 %~3 %~4"=="compose ps -aq mimirsynth" if defined FAKE_CONTAINER echo %FAKE_CONTAINER%',
            'exit /b 0')
          Add-Content -Encoding ASCII $env:GITHUB_PATH $shim
      - name: install.ps1 under Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./.github/installer-config-test.ps1
      - name: install.ps1 under PowerShell 7 on macOS
        if: runner.os == 'macOS'
        shell: pwsh
        run: ./.github/installer-config-test.ps1
  scripts:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.scripts != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck (install.sh, update.sh)
        run: shellcheck install.sh && shellcheck -S warning update.sh .github/update-version-test.sh
      - name: update.sh never goes down on its own, and an explicit older version must know the database (#403)
        run: bash .github/update-version-test.sh
      - name: install.sh and install.ps1 run the same connection test (#360)
        run: |
          a="$(sed -n 's/^PROBE_PY="\(.*\)"$/\1/p' install.sh)"; b="$(sed -n 's/^\$ProbePy = "\(.*\)"$/\1/p' install.ps1)"
          [ -n "$a" ] && [ "$a" = "$b" ]
      - name: install.ps1 parses, is plain ASCII (Windows PowerShell 5.1 reads it in the ANSI code page) and passes PSScriptAnalyzer
        shell: pwsh
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { $_.ToString() }; exit 1 }
          if ([IO.File]::ReadAllBytes("$PWD/install.ps1") | Where-Object { $_ -gt 127 }) { throw "install.ps1 must be plain ASCII: write Spanish letters as \uXXXX" }
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error
          if ($r) { $r | Format-Table -AutoSize | Out-String | Write-Host; exit 1 }
