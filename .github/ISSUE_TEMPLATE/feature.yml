name: Feature request
description: An improvement or a new feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: What problem does it solve}
    validations: {required: true}
  - type: textarea
    id: idea
    attributes: {label: How do you imagine it}
  - type: textarea
    id: alternatives
    attributes: {label: Alternatives you have considered}
