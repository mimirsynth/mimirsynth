name: Error
description: Algo no funciona como debería
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: Qué ocurre, description: Qué esperabas y qué pasó en realidad}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Pasos para reproducirlo}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Versión de MimirSynth, description: "Aparece al pie del menú lateral"}
  - type: textarea
    id: logs
    attributes: {label: Registros o capturas, description: "Revisa que no contengan secretos ni datos privados", render: shell}
