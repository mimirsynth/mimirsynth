name: Bug
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Write in English if you can; Spanish is welcome too and a maintainer will add an English title. · Si lo prefieres, escribe en castellano."
  - type: textarea
    id: what
    attributes: {label: What happens, description: What you expected and what actually happened}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: MimirSynth version, description: "Shown at the bottom of the side menu"}
  - type: textarea
    id: logs
    attributes: {label: Logs or screenshots, description: "Check that they contain no secrets or private data", render: shell}
