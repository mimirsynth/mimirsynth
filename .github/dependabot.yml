version: 2
updates:
  - package-ecosystem: pip
    directory: /api
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: graphiti-core  # fijada: el formato de los datos en FalkorDB depende de la versión
    groups:
      python-deps: {patterns: ["*"], update-types: [minor, patch]}
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    groups:
      web-deps: {patterns: ["*"], update-types: [minor, patch]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: monthly}
