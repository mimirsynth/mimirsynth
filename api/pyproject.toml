[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mimirsynth"
version = "0.7.1"
description = "MimirSynth: memoria para agentes (CoALA) sobre Graphiti, con UI propia"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "falkordb>=1.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "authlib>=1.3",
  "itsdangerous>=2.2",
  "httpx>=0.27",
  "argon2-cffi>=23",
  "segno>=1.6",  # código QR del alta del doble factor (Python puro)
  "webauthn>=2.5",  # llaves de acceso (WebAuthn / passkeys)
  "pgvector>=0.3",
  "alembic>=1.13",
  "graphiti-core[falkordb]==0.30.2",  # fijada: el formato de los datos en FalkorDB depende de la versión
]

[project.optional-dependencies]
pdf = ["pypdf>=4"]  # lectura de PDF en la memoria documental (opcional)

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["mimirsynth"]

[tool.ruff]
line-length = 110
