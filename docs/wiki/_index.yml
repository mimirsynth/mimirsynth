# The wiki's navigation. `python scripts/wiki_index.py` writes _Sidebar.md and the page lists of Home.md and Inicio.md from it;
# never edit those by hand. Pages go by their English title (the file name with spaces); the Spanish title comes from the link at
# the top of each English page. A new page goes into a «sidebar» section (and into «home» if it is a main entry point), or into
# «unlisted» if it is only reached from other pages.
