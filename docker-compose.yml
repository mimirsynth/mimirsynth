services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: mimirsynth
      POSTGRES_DB: mimirsynth
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mimirsynth -d mimirsynth"]
      interval: 10s
      retries: 5

  # Bundled graph engine. Start it with `docker compose --profile bundled up -d` and MIMIRSYNTH_FALKOR_HOST=falkordb.
  # If you already have a FalkorDB, do not use the profile and point MIMIRSYNTH_FALKOR_HOST at it.
  falkordb:
    profiles: ["bundled"]
    image: falkordb/falkordb:v4.22.0
    restart: unless-stopped
    volumes:
      - graphdata:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  # Optional bundled Ollama for embeddings. Start it with `docker compose --profile ollama up -d` and
  # MIMIRSYNTH_EMBEDDING_BASE_URL=http://ollama:11434/v1, then download the model once with
  # `docker compose exec ollama ollama pull nomic-embed-text`. It runs on the CPU; models live in the ollamadata volume.
  # It has no authentication: do not publish its port.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:0.40.15
    restart: unless-stopped
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 5

  # Optional OCR for scanned PDFs and images (Tesseract, Spanish and English). Start it with `docker compose --profile ocr up -d`
  # and MIMIRSYNTH_OCR_URL=http://ocr:8001. It is a separate image so the main one does not grow. It has no authentication: do not
  # publish its port.
  ocr:
    profiles: ["ocr"]
    image: ghcr.io/mimirsynth/mimirsynth-ocr:${MIMIRSYNTH_VERSION:-latest}
    restart: unless-stopped
    environment:
      OCR_WORKERS: "${OCR_WORKERS:-2}"  # documents read at the same time; Tesseract uses one CPU per page
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  mimirsynth:
    image: ghcr.io/mimirsynth/mimirsynth:${MIMIRSYNTH_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${MIMIRSYNTH_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Docker Desktop resolves this name by itself; on Linux this line is needed to reach services on the host (e.g. Ollama)
    environment:
      MIMIRSYNTH_DATABASE_URL: "postgresql+psycopg://mimirsynth:${POSTGRES_PASSWORD}@postgres:5432/mimirsynth"
      MIMIRSYNTH_FALKOR_HOST: "${MIMIRSYNTH_FALKOR_HOST:-falkordb}"
      MIMIRSYNTH_FALKOR_PORT: "${MIMIRSYNTH_FALKOR_PORT:-6379}"
      # An existing graph database (written by the installer): falkordb or neo4j (5.26+). See docs/CONFIGURATION.md.
      MIMIRSYNTH_GRAPH_BACKEND: "${MIMIRSYNTH_GRAPH_BACKEND:-falkordb}"
      MIMIRSYNTH_FALKOR_USERNAME: "${MIMIRSYNTH_FALKOR_USERNAME:-}"
      MIMIRSYNTH_FALKOR_PASSWORD: "${MIMIRSYNTH_FALKOR_PASSWORD:-}"
      MIMIRSYNTH_NEO4J_URI: "${MIMIRSYNTH_NEO4J_URI:-}"
      MIMIRSYNTH_NEO4J_USER: "${MIMIRSYNTH_NEO4J_USER:-}"
      MIMIRSYNTH_NEO4J_PASSWORD: "${MIMIRSYNTH_NEO4J_PASSWORD:-}"
      MIMIRSYNTH_NEO4J_DATABASE: "${MIMIRSYNTH_NEO4J_DATABASE:-}"
      MIMIRSYNTH_DEFAULT_GRAPH: "${MIMIRSYNTH_DEFAULT_GRAPH:-default}"
      MIMIRSYNTH_BOOTSTRAP_GRAPHS: "${MIMIRSYNTH_BOOTSTRAP_GRAPHS:-}"
      MIMIRSYNTH_EMBEDDING_BASE_URL: "${MIMIRSYNTH_EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}"
      MIMIRSYNTH_EMBEDDING_MODEL: "${MIMIRSYNTH_EMBEDDING_MODEL:-nomic-embed-text}"
      MIMIRSYNTH_EMBEDDING_API_KEY: "${MIMIRSYNTH_EMBEDDING_API_KEY:-}"
      MIMIRSYNTH_EMBEDDING_DIM: "${MIMIRSYNTH_EMBEDDING_DIM:-768}"
      MIMIRSYNTH_LLM_BASE_URL: "${MIMIRSYNTH_LLM_BASE_URL:-}"
      MIMIRSYNTH_LLM_API_KEY: "${MIMIRSYNTH_LLM_API_KEY:-}"
      MIMIRSYNTH_LLM_MODEL: "${MIMIRSYNTH_LLM_MODEL:-}"
      MIMIRSYNTH_LLM_SMALL_MODEL: "${MIMIRSYNTH_LLM_SMALL_MODEL:-}"
      MIMIRSYNTH_AUTH_MODE: "${MIMIRSYNTH_AUTH_MODE:-local}"
      MIMIRSYNTH_SESSION_SECRET: "${MIMIRSYNTH_SESSION_SECRET:?define MIMIRSYNTH_SESSION_SECRET}"
      MIMIRSYNTH_PUBLIC_URL: "${MIMIRSYNTH_PUBLIC_URL:-}"
      MIMIRSYNTH_COOKIE_SECURE: "${MIMIRSYNTH_COOKIE_SECURE:-false}"
      MIMIRSYNTH_OIDC_ISSUER: "${MIMIRSYNTH_OIDC_ISSUER:-}"
      MIMIRSYNTH_OIDC_CLIENT_ID: "${MIMIRSYNTH_OIDC_CLIENT_ID:-}"
      MIMIRSYNTH_OIDC_CLIENT_SECRET: "${MIMIRSYNTH_OIDC_CLIENT_SECRET:-}"
      MIMIRSYNTH_DEFAULT_LANGUAGE: "${MIMIRSYNTH_DEFAULT_LANGUAGE:-en}"
      MIMIRSYNTH_ADMIN_EMAILS: "${MIMIRSYNTH_ADMIN_EMAILS:-}"
      MIMIRSYNTH_ACCOUNT_URL: "${MIMIRSYNTH_ACCOUNT_URL:-}"
      MIMIRSYNTH_DOC_STORE: "/data/documents"
      MIMIRSYNTH_DOC_MAX_MB: "${MIMIRSYNTH_DOC_MAX_MB:-2048}"
      MIMIRSYNTH_OCR_URL: "${MIMIRSYNTH_OCR_URL:-}"  # http://ocr:8001 with the "ocr" profile; empty: scanned PDFs and images are not read
      MIMIRSYNTH_DOC_ROOTS_BASE: "/sources"  # source roots are registered under Administration and can only be inside this folder
    volumes:
      - type: bind  # host folder with the directories that can be document sources; always read-only
        source: ${MIMIRSYNTH_SOURCES_DIR:-./sources}
        target: /sources
        read_only: true
        bind: {propagation: rslave, create_host_path: true}  # rslave: anything you mount later under that folder on the host appears inside without a restart
      - docstore:/data/documents  # originals of the document memory: include it in backups together with Postgres
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  pgdata:
  graphdata:
  docstore:
  ollamadata:
